version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Actions only support the ecosystem-wide `default-days` (there is no
    # SemVer-aware cooldown for them), so hold every action update back long
    # enough that a bad release is usually yanked or patched before it shows
    # up here. Security updates ignore cooldown, so this doesn't delay those.
    cooldown:
      default-days: 14

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Only majors wait: they are the ones that need the ecosystem to catch up
    # (see the `ignore` entries below for how often that bites here). Minor
    # and patch updates keep GitHub's default 3-day cooldown.
    cooldown:
      semver-major-days: 14
    ignore:
      # obsidian declares an exact peer dependency on @codemirror/state
      # (currently 6.5.0), so newer @codemirror/* versions break npm install
      - dependency-name: "@codemirror/*"
      # electron is pinned to the major that current Obsidian installers
      # embed (see #282); bump manually when Obsidian ships a newer one
      - dependency-name: electron
        versions: [">=40"]
      # TypeScript >=6 (and the native TS7 compiler) is not yet supported
      # by typescript-eslint, ts-jest, svelte-check, svelte-preprocess and
      # esbuild-svelte; revisit once the ecosystem catches up (see #292)
      - dependency-name: typescript
        versions: [">=6"]
      # eslint-plugin-import only supports eslint up to ^9 (see #293);
      # remove once it supports eslint 10 or after migrating to
      # eslint-plugin-import-x
      - dependency-name: eslint
        versions: [">=10"]
      # @types/node is kept in sync with the Node major this repo builds
      # and tests with (see #282); bump manually together with the toolchain
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
