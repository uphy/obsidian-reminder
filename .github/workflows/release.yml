name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver level to bump (next version is computed from manifest.json)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  # Needed to poll the check-runs API while waiting for the "test" check
  # (see the "Wait for the test check" step below).
  checks: read

env:
  PLUGIN_NAME: obsidian-reminder
  # The electron package is only used for its TypeScript types; skip the
  # ~100MB binary download (electron's install.js honors this variable).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Must be the very first step: pushes made with GITHUB_TOKEN don't
      # trigger other workflows, which breaks the "push to release/**, wait
      # for its check, then push to master" flow below (see the "Push the
      # version bump to a release branch" step) -- release/** would never
      # get a "test" check run. Push as the uphy-ops GitHub App instead,
      # whose pushes do trigger workflows. Kept as the first step so a
      # missing/misconfigured app installation fails before anything else
      # runs.
      - name: Generate a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Bump the versions
        run: |
          manifest_version=$(jq -r '.version' manifest.json)
          package_version=$(jq -r '.version' package.json)
          if [ "$manifest_version" != "$package_version" ]; then
            echo "manifest.json version ($manifest_version) and package.json version ($package_version) are out of sync. Sync them before releasing."
            exit 1
          fi

          npm version "${{ github.event.inputs.bump }}" --no-git-tag-version

          version=$(jq -r '.version' package.json)
          echo "RELEASE_VERSION=$version" >> $GITHUB_ENV

          min_app_version=$(jq -r '.minAppVersion' manifest.json)
          jq --tab --arg v "$version" '.version = $v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
          jq --arg v "$version" --arg min "$min_app_version" '. + {($v): $min}' versions.json > versions.json.tmp && mv versions.json.tmp versions.json

      - name: Build
        id: build
        run: |
          npm run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}

      - name: Push the version bump to a release branch
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json versions.json package.json package-lock.json
          git commit -m "Update the version to $RELEASE_VERSION"

          RELEASE_BRANCH="release/$RELEASE_VERSION"
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV

          # master's branch protection requires the "test" status check to
          # be present and passing on a commit before that commit can be
          # pushed there, but a direct push carries no check at all, so it
          # gets rejected ("Required status check \"test\" is expected.").
          # Status checks are evaluated per commit SHA, not per branch, so
          # push this commit to a release/** branch first -- pr.yml also
          # runs "test" on pushes to release/** -- wait for that check to
          # pass, then push the very same SHA to master below. By then the
          # commit already carries a passing "test" check, so the protected
          # push to master succeeds.
          #
          # Force the push: a previously failed run may have left the same
          # release/<version> branch behind (e.g. it failed before deleting
          # it below), and re-running the release for the same version must
          # not fail with a non-fast-forward error.
          git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Wait for the "test" check on the release branch commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          # A cold cache (npm ci) followed by lint, tsc, svelte-check, and
          # jest can take 5-8 minutes on its own, so give the check run
          # enough room to complete before giving up.
          timeout=900
          interval=15
          elapsed=0

          echo "Waiting for the \"test\" check run to complete on $sha..."
          while true; do
            # `gh api --jq` prints nothing (not "null") when the filtered
            # array is empty, e.g. before pr.yml has created the "test"
            # check run yet. Capture the raw check-runs response first and
            # run a single jq over it so status/conclusion still resolve to
            # their "not created yet" defaults in that case.
            check_runs=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs")
            status=$(echo "$check_runs" | jq -r '[.check_runs[] | select(.name == "test")][0] | if . == null then "queued" else (.status // "queued") end')
            conclusion=$(echo "$check_runs" | jq -r '[.check_runs[] | select(.name == "test")][0] | if . == null then "null" else (.conclusion // "null") end')

            echo "elapsed=${elapsed}s status=${status} conclusion=${conclusion}"

            if [ "$status" == "completed" ]; then
              if [ "$conclusion" == "success" ]; then
                echo "\"test\" check passed."
                break
              fi
              echo "\"test\" check did not succeed (conclusion: $conclusion)."
              exit 1
            fi

            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timed out after ${timeout}s waiting for the \"test\" check to complete."
              exit 1
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

      - name: Push the checked commit to master and tag
        run: |
          git push origin "HEAD:master"
          git tag "$RELEASE_VERSION"
          git push --tags
          git push origin --delete "$RELEASE_BRANCH"

      - name: Clean up the release branch if a later step failed
        # Only reached when a step above failed after the release branch was
        # pushed. The success path already deletes it in the previous step,
        # so tolerate a missing branch here instead of failing the job.
        if: failure() && env.RELEASE_BRANCH != ''
        run: |
          git push origin --delete "$RELEASE_BRANCH" || true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            main.js
            manifest.json
            styles.css

  gh-pages:
    runs-on: ubuntu-latest
    needs: release
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build pages
        working-directory: ./docs
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/src/.vuepress/dist
