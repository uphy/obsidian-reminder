name: Release - beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The beta version of the plugin e.g. 1.0.0-beta.1"
        required: true

permissions:
  contents: write
  # Both needed to attest the release assets (see the "Attest" step below).
  attestations: write
  id-token: write
  pull-requests: write

env:
  # The electron package is only used for its TypeScript types; skip the
  # ~100MB binary download (electron's install.js honors this variable).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  release-beta:
    runs-on: ubuntu-latest

    steps:
      # Only used for the "gh pr create" call below. Pushes to develop and
      # the release-beta-* branch stay on GITHUB_TOKEN, since develop has no
      # required status checks and a plain branch push doesn't trigger
      # pr.yml anyway. But a pull request opened with GITHUB_TOKEN doesn't
      # trigger pull_request workflow runs either, so it would never get a
      # "test" check and could never satisfy master's required status check.
      # Open the PR as the uphy-ops GitHub App instead, whose PRs do trigger
      # workflows.
      - name: Generate a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - name: Update the versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ github.event.inputs.version }}
          echo "RELEASE_VERSION=$version" >> $GITHUB_ENV

          # update manifest version
          sed -i "s/\"version\": \".*\"/\"version\": \"$version\"/" manifest-beta.json

          # commit and push the changes
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest-beta.json
          git commit -m "Update the version to $version"
          git push origin develop
          git tag $version
          git push --tags

          # cherry pick the manifest change to master
          git checkout -b release-beta-$version origin/master
          git cherry-pick $version
          git push origin release-beta-$version
          GH_TOKEN="${{ steps.app-token.outputs.token }}" gh pr create -B master -t "Release $version" -b ""

          # go back to develop
          git checkout develop
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build
        id: build
        run: |
          npm ci
          npm run build
          # BRAT reads manifest.json from the release assets, so it must carry the beta version
          cp manifest-beta.json manifest.json

      # Lets users cryptographically verify that the published main.js and
      # styles.css were built from this repository by this workflow.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
